name: Profile or control proposal
description: Propose a public model, schema, control or reference change.
title: "[Proposal] "
labels:
  - proposal
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What governance or assurance problem should be addressed?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources and traceability
      description: Cite standards, regulations, research or documented practice.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Information boundary
      options:
        - label: This contains no customer-confidential or commercially restricted material.
          required: true
